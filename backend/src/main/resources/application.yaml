spring:
  application:
    name: backend

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60

google:
  vision:
    api-key: ${GOOGLE_VISION_API_KEY}

gemini:
  api:
    key: ${GEMINI_API_KEY}